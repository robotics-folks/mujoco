[workspace]
channels = ["https://prefix.dev/conda-forge"]
platforms = ["linux-64"]

[workspace.build-variants]
c_compiler = ["gcc"]
c_compiler_version = ["<15"]

cxx_compiler = ["gxx"]
cxx_compiler_version = ["<15"]

[dependencies]
pkg-config = ">=0.29.2,<0.30"
libegl-devel = ">=1.7.0,<2"
libgl-devel = ">=1.7.0,<2"
libglu = ">=9.0.3,<10"
libxcb = ">=1.17.0,<2"
libxkbcommon = ">=1.13.2,<2"
libxkbfile = "*"
wayland = "*"
xcb-util = "*"
xkeyboard-config = "*"
xorg-xorgproto = "*"
xorg-libx11 = "*"
xorg-libxcomposite = "*"
xorg-libxdamage = "*"
xorg-libxi = "*"
xorg-libxinerama = "*"
xorg-libxrandr = "*"
xorg-libxrender = "*"
xorg-libxtst = "*"
xorg-libxcursor = ">=1.2.3,<2"
gcc = "<15"
gxx = "<15"
